<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bookly Support</title>
<style>
  :root {
    --brand: #2f5233;
    --brand-dark: #203a24;
    --bg: #ffffff;
    --panel: #f7f6f2;
    --border: #e6e3da;
    --text: #1f1f1f;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    padding: 16px;
  }

  /* This page is loaded inside an iframe that the /embed.js loader script
     resizes to match (bubble size when closed, panel size when open) —
     see embed.js. Everything here fills that iframe exactly; there's no
     independent fixed positioning, the HOST PAGE's iframe placement does
     that job. */

  #chat-launcher {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: var(--brand);
    color: white;
    border: none;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease;
  }
  #chat-launcher:hover { transform: scale(1.05); }

  #chat-panel {
    width: 100%;
    height: 100%;
    background: var(--bg);
    border-radius: var(--radius);
    box-shadow: 0 12px 40px rgba(0,0,0,0.3);
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  #chat-panel.open { display: flex; }
  #chat-header {
    background: var(--brand);
    color: white;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  #chat-header .title { font-weight: 600; font-size: 15px; }
  #chat-header .subtitle { font-size: 12px; opacity: 0.85; margin-top: 2px; }
  #chat-close { background: none; border: none; color: white; font-size: 20px; cursor: pointer; padding: 4px; }
  #chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #fdfdfb; }
  .msg { max-width: 82%; padding: 10px 13px; border-radius: var(--radius); font-size: 14px; line-height: 1.45; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--brand); color: white; border-bottom-right-radius: 4px; }
  .msg.agent { align-self: flex-start; background: var(--panel); color: var(--text); border-bottom-left-radius: 4px; }
  .msg.system { align-self: center; background: transparent; color: #999; font-size: 12px; max-width: 100%; text-align: center; }
  .msg.typing { color: #999; font-style: italic; }
  #chat-input-row { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); background: white; flex-shrink: 0; }
  #chat-input { flex: 1; padding: 10px 12px; border-radius: 999px; border: 1px solid #ddd; font-size: 14px; outline: none; }
  #chat-input:focus { border-color: var(--brand); }
  #chat-send { background: var(--brand); color: white; border: none; border-radius: 999px; padding: 0 18px; font-size: 14px; cursor: pointer; }
  #chat-send:hover { background: var(--brand-dark); }
  #chat-send:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>

<button id="chat-launcher" aria-label="Open support chat">💬</button>

<div id="chat-panel">
  <div id="chat-header">
    <div>
      <div class="title">Bookly Support</div>
      <div class="subtitle">Usually replies in a few seconds</div>
    </div>
    <button id="chat-close" aria-label="Close chat">✕</button>
  </div>
  <div id="chat-messages"></div>
  <div id="chat-input-row">
    <input id="chat-input" type="text" placeholder="Type your message…" autocomplete="off" />
    <button id="chat-send">Send</button>
  </div>
</div>

<script>
(function () {
  const launcher = document.getElementById('chat-launcher');
  const panel = document.getElementById('chat-panel');
  const closeBtn = document.getElementById('chat-close');
  const messagesEl = document.getElementById('chat-messages');
  const input = document.getElementById('chat-input');
  const sendBtn = document.getElementById('chat-send');

  let sessionId = null;
  let opened = false;

  // Same origin as this page (the backend serves this file), so /api/chat
  // is always a same-origin call regardless of which third-party site the
  // surrounding iframe is embedded on.
  const backendUrl = window.location.origin;

  function notifyParent(open) {
    // Tells the /embed.js loader script (running on the host page) to
    // resize the iframe — see embed.js's message listener.
    window.parent.postMessage({ source: 'bookly-widget', type: 'resize', open }, '*');
  }

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function greet() {
    addMessage('agent', "Hi! I'm the Bookly support assistant. I can help with order status, returns & refunds, or general questions about shipping, policies, and your account. How can I help today?");
  }

  launcher.addEventListener('click', () => {
    panel.classList.add('open');
    launcher.style.display = 'none';
    notifyParent(true);
    if (!opened) { opened = true; greet(); }
    input.focus();
  });

  closeBtn.addEventListener('click', () => {
    panel.classList.remove('open');
    launcher.style.display = 'flex';
    notifyParent(false);
  });

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    addMessage('user', text);
    input.value = '';
    sendBtn.disabled = true;
    const typingEl = addMessage('agent typing', 'Typing…');
    try {
      const res = await fetch(backendUrl + '/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });
      if (!res.ok) throw new Error('Request failed: ' + res.status);
      const data = await res.json();
      sessionId = data.session_id;
      typingEl.remove();
      addMessage('agent', data.reply);
    } catch (err) {
      typingEl.remove();
      addMessage('system', 'Could not reach support right now (' + err.message + '). Please try again shortly.');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
})();
</script>

</body>
</html>
