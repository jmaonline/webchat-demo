# Render "Blueprint" spec — https://render.com/docs/blueprint-spec
# In the Render dashboard: New + -> Blueprint -> connect this repo.
# Render reads this file and provisions the service automatically.
services:
  - type: web
    name: bookly-support-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ANTHROPIC_API_KEY
        sync: false   # set manually in the Render dashboard — do not commit it
      - key: ADMIN_API_TOKEN
        sync: false   # set manually in the Render dashboard — protects /api/admin/*
